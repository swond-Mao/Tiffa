<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:;">
  <title>Tiffa</title>
  <!-- hljs 双主题：由渲染层 JS 按当前主题模式切换 disabled（与旧版行为一致）。
       文件位于 public/hljs/，Vite 原样复制到 dist，不被打包内联。 -->
  <link rel="stylesheet" id="hljs-dark" href="./hljs/atom-one-dark.min.css">
  <link rel="stylesheet" id="hljs-light" href="./hljs/atom-one-light.min.css" disabled>
  <!-- 主题引擎必须在 <head> 同步加载：body 一渲染就是全屏启动遮罩，
       若放到 </body> 前，遮罩会先用 styles.css 的 Eucalyptus Dark fallback
       画一帧再跳到用户主题。themes.js 末尾有早期注入 IIFE 负责立即写入变量。
       文件位于 public/themes.js（构建副本），Vite 原样复制到 dist。 -->
  <script src="./themes.js"></script>
  <script type="module" crossorigin src="./assets/index.D-WgJBq8.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.CYm5Jzci.css">
</head>
<body>
  <!-- 启动全屏遮罩：覆盖一切，由 React StartupRitual 接管控制，完成后淡出移除
       自定义背景图：把图片命名为 startup-image.png/.jpg/.webp/.gif 放入便携根目录
       data/ 文件夹即可替换默认星空侧脸图（呼吸/缩放/径向遮罩保留） -->
  <div id="startupOverlay" class="startup-overlay">
    <div class="startup-muse" aria-hidden="true">
      <div class="muse-layer l0"></div>
      <div class="muse-layer l1"></div>
      <div class="muse-layer l2"></div>
      <div class="muse-layer l3"></div>
      <div class="muse-tint"></div>
    </div>
    <div class="startup-logo">Tiffa</div>
    <div class="startup-title">与万物对弈，伴时间同行</div>
    <div class="startup-ripple">
      <span class="ripple-ring r1"></span>
      <span class="ripple-ring r2"></span>
      <span class="ripple-ring r3"></span>
      <span class="ripple-core"></span>
    </div>
    <div class="startup-status" id="startupStatus">夜色将尽，晨光初透</div>
    <div class="startup-progress" id="startupProgress">
      <div class="startup-progress-bar" id="startupProgressBar"></div>
    </div>
  </div>

  <!-- React 挂载点：全部 UI 由 src/ 下的组件树渲染 -->
  <div id="app">
    <div id="root"></div>
  </div>

</body>
</html>
