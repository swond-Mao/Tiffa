<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e17;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e2e8f0}
.deck{width:100%;height:100%;position:relative}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 80px;opacity:0;transition:opacity .4s ease;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.slide .inner{width:100%;max-width:1100px;margin:0 auto}
/* slide number */
.slide-num{position:fixed;bottom:24px;right:32px;font-size:13px;color:#4a5568;font-variant-numeric:tabular-nums;z-index:100;font-family:'SF Mono',Consolas,monospace}
/* cover */
.slide-cover{text-align:center}
.slide-cover .title{font-size:52px;font-weight:700;letter-spacing:-1px;background:linear-gradient(135deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px;line-height:1.2}
.slide-cover .subtitle{font-size:20px;color:#94a3b8;font-weight:300;letter-spacing:2px;margin-bottom:32px;text-transform:uppercase}
.slide-cover .meta{font-size:14px;color:#4a5568}
.slide-cover .accent-line{width:60px;height:3px;background:linear-gradient(90deg,#00d4ff,#a855f7);margin:0 auto 24px;border-radius:2px}
/* section */
.slide-section{text-align:center}
.slide-section .section-num{font-size:120px;font-weight:800;background:linear-gradient(135deg,#00d4ff33,#a855f733);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;font-family:'SF Mono',Consolas,monospace}
.slide-section .title{font-size:36px;font-weight:600;color:#e2e8f0}
.slide-section .accent-line{width:40px;height:2px;background:#00d4ff;margin:16px auto;border-radius:1px}
/* content */
.slide-content .title{font-size:32px;font-weight:600;color:#f1f5f9;margin-bottom:20px}
.slide-content .title .num{color:#00d4ff;font-family:'SF Mono',Consolas,monospace;margin-right:12px}
.slide-content .body{font-size:17px;line-height:1.8;color:#94a3b8;max-width:800px}
.slide-content .body p{margin-bottom:12px}
.slide-content .body ul{padding-left:20px;list-style:none}
.slide-content .body ul li::before{content:"▸ ";color:#00d4ff}
.slide-content .body ul li{margin-bottom:8px;color:#cbd5e1}
/* content-left / content-right */
.slide-side{display:flex;gap:60px;align-items:center}
.slide-side .text-col{flex:1}
.slide-side .text-col .title{font-size:30px;font-weight:600;color:#f1f5f9;margin-bottom:16px}
.slide-side .text-col .body{font-size:16px;line-height:1.8;color:#94a3b8}
.slide-side .text-col .body ul{padding-left:20px;list-style:none}
.slide-side .text-col .body ul li::before{content:"▸ ";color:#00d4ff}
.slide-side .text-col .body ul li{margin-bottom:6px;color:#cbd5e1}
.slide-side .img-col{flex:1;min-height:300px;border-radius:12px;overflow:hidden;border:1px solid #1e293b;background:#111827;display:flex;align-items:center;justify-content:center}
.slide-side .img-col img{width:100%;height:100%;object-fit:cover;display:block}
.slide-side .img-col .img-placeholder{color:#4a5568;font-size:14px}
/* two-column */
.slide-2col{display:flex;gap:40px}
.slide-2col .col{flex:1}
.slide-2col .col .col-title{font-size:20px;font-weight:600;color:#e2e8f0;margin-bottom:12px}
.slide-2col .col .col-title .num{color:#00d4ff;margin-right:8px}
.slide-2col .col .body{font-size:15px;line-height:1.7;color:#94a3b8}
.slide-2col .col .body ul{padding-left:16px;list-style:none}
.slide-2col .col .body ul li::before{content:"▸ ";color:#00d4ff}
.slide-2col .col .body ul li{margin-bottom:6px;color:#cbd5e1}
/* quote */
.slide-quote{text-align:center;max-width:800px;margin:0 auto}
.slide-quote .quote-text{font-size:32px;font-weight:300;line-height:1.6;color:#e2e8f0;font-style:italic;margin-bottom:16px}
.slide-quote .quote-text::before{content:"\201C";color:#00d4ff;font-size:48px;opacity:.5;margin-right:8px}
.slide-quote .quote-text::after{content:"\201D";color:#00d4ff;font-size:48px;opacity:.5;margin-left:8px}
.slide-quote .quote-source{font-size:15px;color:#4a5568}
/* data */
.slide-data{text-align:center}
.slide-data .big-number{font-size:96px;font-weight:800;background:linear-gradient(135deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px;font-family:'SF Mono',Consolas,monospace}
.slide-data .data-label{font-size:18px;color:#94a3b8;margin-bottom:12px}
.slide-data .data-desc{font-size:16px;color:#4a5568;max-width:500px;margin:0 auto;line-height:1.6}
/* image full */
.slide-image-full{position:relative;overflow:hidden}
.slide-image-full .img-bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.slide-image-full .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(10,14,23,.85),rgba(10,14,23,.4))}
.slide-image-full .inner{position:relative;z-index:1;text-align:center}
.slide-image-full .title{font-size:42px;font-weight:700;color:#f1f5f9;margin-bottom:16px}
.slide-image-full .sub{font-size:18px;color:#94a3b8}
/* arrows */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:100;background:rgba(30,41,59,.6);border:1px solid #1e293b;color:#94a3b8;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s;backdrop-filter:blur(4px)}
.arrow:hover{background:rgba(30,41,59,.9);color:#e2e8f0;border-color:#00d4ff}
.arrow-left{left:16px}
.arrow-right{right:16px}
.arrow.hidden{display:none}
/* progress */
.progress{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:100}
.progress .dot{width:8px;height:8px;border-radius:50%;background:#1e293b;cursor:pointer;transition:.2s}
.progress .dot.active{background:#00d4ff;width:24px;border-radius:4px}
/* hint */
.hint{position:fixed;bottom:24px;left:32px;font-size:12px;color:#1e293b;z-index:100}
/* highlights */
.accent-cyan{color:#00d4ff}
.accent-purple{color:#a855f7}
.tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;background:#00d4ff22;color:#00d4ff;border:1px solid #00d4ff44;margin-right:6px;font-family:'SF Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="deck">{SLIDES}</div>
<div class="arrow arrow-left" id="arrowLeft">&lsaquo;</div>
<div class="arrow arrow-right" id="arrowRight">&rsaquo;</div>
<div class="progress" id="progress"></div>
<div class="slide-num" id="slideNum"></div>
<div class="hint">&larr; &rarr; 翻页 &middot; F 全屏 &middot; ESC 缩略</div>
<script>
(function(){'use strict';
var slides=document.querySelectorAll('.slide');
var current=0,total=slides.length;
function show(i){
  if(i<0||i>=total)return;
  slides[current].classList.remove('active');
  slides[i].classList.add('active');
  current=i;
  updateUI();
}
function updateUI(){
  document.getElementById('slideNum').textContent=(current+1)+' / '+total;
  document.getElementById('arrowLeft').classList.toggle('hidden',current===0);
  document.getElementById('arrowRight').classList.toggle('hidden',current===total-1);
  var dots=document.querySelectorAll('.progress .dot');
  dots.forEach(function(d,i){d.classList.toggle('active',i===current);});
}
function buildProgress(){
  var el=document.getElementById('progress');
  for(var i=0;i<total;i++){
    var d=document.createElement('div');d.className='dot';
    d.onclick=function(j){return function(){show(j);};}(i);
    el.appendChild(d);
  }
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(current+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(current-1);}
  if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
});
document.getElementById('arrowLeft').onclick=function(){show(current-1);};
document.getElementById('arrowRight').onclick=function(){show(current+1);};
var touchStartX=0;
document.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX;});
document.addEventListener('touchend',function(e){
  var diff=touchStartX-e.changedTouches[0].screenX;
  if(Math.abs(diff)>50){if(diff>0)show(current+1);else show(current-1);}
});
if(total>0)slides[0].classList.add('active');
buildProgress();updateUI();
})();
</script>
</body>
</html>
