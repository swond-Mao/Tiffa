<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#faf6f0;font-family:'Inter', 'Segoe UI', system-ui, sans-serif;color:#1a1410}
.deck{width:100%;height:100%;position:relative}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:60px 80px;opacity:0;transition:opacity .4s ease;pointer-events:none;background:#faf6f0;}
.slide.active{opacity:1;pointer-events:auto}
.slide .inner{width:100%;max-width:1000px;margin:0 auto}
.slide-num{position:fixed;bottom:24px;right:32px;font-size:12px;color:#6b5c4e;font-variant-numeric:tabular-nums;z-index:100;font-family:'SF Mono', Consolas, monospace}
/* cover */
.slide-cover{text-align:center}
.slide-cover .title{font-size:48px;font-weight:800;color:#1a1410;;margin-bottom:12px;line-height:1.15}
.slide-cover .accent-line{width:50px;height:3px;background:#e85d3a;margin:0 auto 20px;border-radius:2px}
.slide-cover .subtitle{font-size:17px;color:#6b5c4e;font-weight:300;letter-spacing:1px;margin-bottom:16px}
.slide-cover .meta{font-size:13px;color:#6b5c4e;opacity:0.6}
/* section */
.slide-section{text-align:center}
.slide-section .section-num{font-size:96px;font-weight:800;color:color-mix(in srgb, #e85d3a 15%, transparent);line-height:1;margin-bottom:8px;font-family:'SF Mono', Consolas, monospace}
.slide-section .title{font-size:34px;font-weight:600;color:#1a1410}
.slide-section .accent-line{width:36px;height:2px;background:#e85d3a;margin:14px auto;border-radius:1px}
/* content */
.slide-content .title{font-size:26px;font-weight:600;color:#1a1410;margin-bottom:14px}
.slide-content .title .num{color:#e85d3a;font-family:'SF Mono', Consolas, monospace;margin-right:8px}
.slide-content .body{font-size:16px;line-height:1.8;color:#6b5c4e;max-width:750px}
.slide-content .body p{margin-bottom:10px}
.slide-content .body ul{padding-left:18px;list-style:none}
.slide-content .body ul li::before{content:"▸ ";color:#e85d3a}
.slide-content .body ul li{margin-bottom:6px;color:#6b5c4e}
/* side-by-side */
.slide-side{display:flex;gap:48px;align-items:center}
.slide-side .text-col{flex:1}
.slide-side .text-col .title{font-size:24px;font-weight:600;color:#1a1410;margin-bottom:12px}
.slide-side .text-col .body{font-size:15px;line-height:1.8;color:#6b5c4e}
.slide-side .text-col .body ul{padding-left:16px;list-style:none}
.slide-side .text-col .body ul li::before{content:"▸ ";color:#e85d3a}
.slide-side .text-col .body ul li{margin-bottom:5px}
.slide-side .img-col{flex:1;min-height:300px;background:#f8f9fa;border:1px solid #e0d5c8;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slide-side .img-col img{width:100%;height:100%;object-fit:cover;display:block}
.slide-side .img-col .img-placeholder{color:#6b5c4e;font-size:13px;opacity:0.5}
/* two-column */
.slide-2col{display:flex;gap:32px}
.slide-2col .col{flex:1}
.slide-2col .col .col-title{font-size:18px;font-weight:600;color:#1a1410;margin-bottom:10px}
.slide-2col .col .col-title .num{color:#e85d3a;margin-right:6px}
.slide-2col .col .body{font-size:14px;line-height:1.7;color:#6b5c4e}
.slide-2col .col .body ul{padding-left:14px;list-style:none}
.slide-2col .col .body ul li::before{content:"▸ ";color:#e85d3a}
/* quote */
.slide-quote{text-align:center;max-width:750px;margin:0 auto}
.slide-quote .quote-text{font-size:30px;font-weight:300;line-height:1.7;color:#1a1410;font-style:italic;margin-bottom:12px}
.slide-quote .quote-text::before{content:"\201C";color:#e85d3a;font-size:48px;opacity:.3;margin-right:6px;vertical-align:middle}
.slide-quote .quote-text::after{content:"\201D";color:#e85d3a;font-size:48px;opacity:.3;margin-left:6px;vertical-align:middle}
.slide-quote .quote-source{font-size:14px;color:#6b5c4e}
/* data */
.slide-data{text-align:center}
.slide-data .big-number{font-size:88px;font-weight:800;color:#1a1410;;line-height:1;margin-bottom:6px;font-family:'SF Mono', Consolas, monospace}
.slide-data .data-label{font-size:16px;color:#6b5c4e;margin-bottom:10px;letter-spacing:1px}
.slide-data .data-desc{font-size:15px;color:#6b5c4e;max-width:450px;margin:0 auto;line-height:1.6;opacity:0.6}
/* image full */
.slide-image-full{position:relative;overflow:hidden}
.slide-image-full .img-bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.slide-image-full .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(0,0,0,.55),rgba(0,0,0,.15))}
.slide-image-full .inner{position:relative;z-index:1;text-align:center}
.slide-image-full .title{font-size:40px;font-weight:700;color:#fff;margin-bottom:12px}
.slide-image-full .sub{font-size:16px;color:rgba(255,255,255,.6)}
/* arrows */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:100;#fff;border:1px solid #e0d5c8;color:#6b5c4e;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.arrow:hover{color:#e85d3a;border-color:#e85d3a;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.arrow-left{left:12px}
.arrow-right{right:12px}
.arrow.hidden{display:none}
/* progress */
.progress{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:100}
.progress .dot{width:6px;height:6px;border-radius:50%;rgba(0,0,0,.1);cursor:pointer;transition:.2s}
.progress .dot.active{background:#e85d3a;width:18px;border-radius:3px}
/* hint */
.hint{position:fixed;bottom:24px;left:32px;font-size:11px;color:#6b5c4e;z-index:100;opacity:0.3}
/* card wrapper */

</style>
</head>
<body>
<div class="deck">{SLIDES}</div>
<div class="arrow arrow-left" id="arrowLeft">&lsaquo;</div>
<div class="arrow arrow-right" id="arrowRight">&rsaquo;</div>
<div class="progress" id="progress"></div>
<div class="slide-num" id="slideNum"></div>
<div class="hint">&larr; &rarr; 翻页 &middot; F 全屏</div>
<script>
(function(){'use strict';
var s=document.querySelectorAll('.slide'),c=0,t=s.length;
function show(i){if(i<0||i>=t)return;s[c].classList.remove('active');s[i].classList.add('active');c=i;u();}
function u(){
  document.getElementById('slideNum').textContent=(c+1)+' / '+t;
  document.getElementById('arrowLeft').classList.toggle('hidden',c===0);
  document.getElementById('arrowRight').classList.toggle('hidden',c===t-1);
  document.querySelectorAll('.progress .dot').forEach(function(d,i){d.classList.toggle('active',i===c);});
}
function bp(){
  var el=document.getElementById('progress');
  for(var i=0;i<t;i++){var d=document.createElement('div');d.className='dot';d.onclick=function(j){return function(){show(j);};}(i);el.appendChild(d);}
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(c+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(c-1);}
  if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
});
document.getElementById('arrowLeft').onclick=function(){show(c-1);};
document.getElementById('arrowRight').onclick=function(){show(c+1);};
var tx=0;document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;});
document.addEventListener('touchend',function(e){var d=tx-e.changedTouches[0].screenX;if(Math.abs(d)>50){if(d>0)show(c+1);else show(c-1);}});
if(t>0)s[0].classList.add('active');bp();u();
})();
</script>
</body>
</html>
