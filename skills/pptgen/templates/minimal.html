<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:'Inter','Segoe UI','Helvetica Neue',sans-serif;color:#1a1a2e}
.deck{width:100%;height:100%;position:relative}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:64px 96px;opacity:0;transition:opacity .4s ease;pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.slide .inner{width:100%;max-width:900px;margin:0 auto}
.slide-num{position:fixed;bottom:24px;right:32px;font-size:12px;color:#cbd5e1;font-variant-numeric:tabular-nums;z-index:100;font-family:'SF Mono',Consolas,monospace}
/* cover */
.slide-cover{text-align:left}
.slide-cover .title{font-size:44px;font-weight:700;color:#1a1a2e;letter-spacing:-1px;margin-bottom:12px;line-height:1.15}
.slide-cover .accent-line{width:60px;height:3px;background:#2563eb;margin:0 0 20px;border-radius:2px}
.slide-cover .subtitle{font-size:18px;color:#64748b;font-weight:400;letter-spacing:.5px;margin-bottom:20px}
.slide-cover .meta{font-size:13px;color:#94a3b8}
/* section */
.slide-section{text-align:left}
.slide-section .section-num{font-size:72px;font-weight:800;color:#f1f5f9;line-height:1;margin-bottom:-16px;font-family:'SF Mono',Consolas,monospace}
.slide-section .title{font-size:32px;font-weight:600;color:#1a1a2e;letter-spacing:-.5px}
.slide-section .accent-line{width:40px;height:2px;background:#2563eb;margin:12px 0;border-radius:1px}
/* content */
.slide-content .title{font-size:26px;font-weight:600;color:#1a1a2e;margin-bottom:14px;letter-spacing:-.3px}
.slide-content .title .num{color:#2563eb;font-weight:500;margin-right:8px}
.slide-content .body{font-size:16px;line-height:1.8;color:#475569;max-width:720px}
.slide-content .body p{margin-bottom:10px}
.slide-content .body ul{padding-left:18px;list-style:none}
.slide-content .body ul li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#2563eb;margin-right:10px;vertical-align:middle}
.slide-content .body ul li{margin-bottom:6px;color:#475569}
/* content-left / content-right */
.slide-side{display:flex;gap:48px;align-items:center}
.slide-side .text-col{flex:1}
.slide-side .text-col .title{font-size:24px;font-weight:600;color:#1a1a2e;margin-bottom:12px}
.slide-side .text-col .body{font-size:15px;line-height:1.8;color:#475569}
.slide-side .text-col .body ul{padding-left:16px;list-style:none}
.slide-side .text-col .body ul li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#2563eb;margin-right:8px;vertical-align:middle}
.slide-side .text-col .body ul li{margin-bottom:5px}
.slide-side .img-col{flex:1;min-height:300px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slide-side .img-col img{width:100%;height:100%;object-fit:cover;display:block}
.slide-side .img-col .img-placeholder{color:#cbd5e1;font-size:14px}
/* two-column */
.slide-2col{display:flex;gap:32px}
.slide-2col .col{flex:1}
.slide-2col .col .col-title{font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:10px}
.slide-2col .col .col-title .num{color:#2563eb;margin-right:6px}
.slide-2col .col .body{font-size:14px;line-height:1.7;color:#475569}
.slide-2col .col .body ul{padding-left:14px;list-style:none}
.slide-2col .col .body ul li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#2563eb;margin-right:8px;vertical-align:middle}
/* quote */
.slide-quote{text-align:center;max-width:700px;margin:0 auto}
.slide-quote .quote-text{font-size:28px;font-weight:400;line-height:1.7;color:#1a1a2e;font-style:italic;margin-bottom:12px;border-left:3px solid #2563eb;padding-left:24px;text-align:left}
.slide-quote .quote-source{font-size:14px;color:#94a3b8;text-align:left;padding-left:24px}
/* data */
.slide-data{text-align:center}
.slide-data .big-number{font-size:96px;font-weight:800;color:#1a1a2e;line-height:1;margin-bottom:4px;font-family:'SF Mono',Consolas,monospace}
.slide-data .data-label{font-size:14px;color:#64748b;margin-bottom:8px;letter-spacing:2px;text-transform:uppercase;font-weight:500}
.slide-data .data-desc{font-size:15px;color:#94a3b8;max-width:450px;margin:0 auto;line-height:1.6}
/* image full */
.slide-image-full{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.slide-image-full .img-bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.slide-image-full .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(26,26,46,.7),rgba(26,26,46,.2))}
.slide-image-full .inner{position:relative;z-index:1;text-align:center}
.slide-image-full .title{font-size:36px;font-weight:700;color:#fff;margin-bottom:10px}
.slide-image-full .sub{font-size:16px;color:#cbd5e1}
/* arrows */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:100;background:#fff;border:1px solid #e2e8f0;color:#94a3b8;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.arrow:hover{border-color:#2563eb;color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.1)}
.arrow-left{left:12px}
.arrow-right{right:12px}
.arrow.hidden{display:none}
/* progress */
.progress{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:100}
.progress .dot{width:6px;height:6px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:.2s}
.progress .dot.active{background:#2563eb;width:18px;border-radius:3px}
/* hint */
.hint{position:fixed;bottom:24px;left:32px;font-size:11px;color:#e2e8f0;z-index:100}
</style>
</head>
<body>
<div class="deck">{SLIDES}</div>
<div class="arrow arrow-left" id="arrowLeft">&lsaquo;</div>
<div class="arrow arrow-right" id="arrowRight">&rsaquo;</div>
<div class="progress" id="progress"></div>
<div class="slide-num" id="slideNum"></div>
<div class="hint">&larr; &rarr;</div>
<script>
(function(){'use strict';
var s=document.querySelectorAll('.slide'),c=0,t=s.length;
function show(i){if(i<0||i>=t)return;s[c].classList.remove('active');s[i].classList.add('active');c=i;u();}
function u(){
  document.getElementById('slideNum').textContent=(c+1)+' / '+t;
  document.getElementById('arrowLeft').classList.toggle('hidden',c===0);
  document.getElementById('arrowRight').classList.toggle('hidden',c===t-1);
  document.querySelectorAll('.progress .dot').forEach(function(d,i){d.classList.toggle('active',i===c);});
}
function bp(){
  var el=document.getElementById('progress');
  for(var i=0;i<t;i++){var d=document.createElement('div');d.className='dot';d.onclick=function(j){return function(){show(j);};}(i);el.appendChild(d);}
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(c+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(c-1);}
  if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
});
document.getElementById('arrowLeft').onclick=function(){show(c-1);};
document.getElementById('arrowRight').onclick=function(){show(c+1);};
var tx=0;document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;});
document.addEventListener('touchend',function(e){var d=tx-e.changedTouches[0].screenX;if(Math.abs(d)>50){if(d>0)show(c+1);else show(c-1);}});
if(t>0)s[0].classList.add('active');bp();u();
})();
</script>
</body>
</html>
