<!-- ============================================================
  shared-visual-components / components/data/stat-card.html
  数字统计卡片 — 片段（嵌入 layout 使用）
  用法：复制 <section class="stats"> 块到你的页面
  ============================================================ -->
<section class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-md);padding:var(--space-lg);">
  <!-- 统计 1 -->
  <div class="card" style="text-align:center;padding:var(--space-xl);">
    <div class="text-gradient" style="font-size:var(--font-size-4xl);font-weight:var(--font-weight-black);font-family:var(--font-mono);line-height:1;">{STAT1_VALUE}</div>
    <div style="margin-top:var(--space-sm);font-size:var(--font-size-sm);color:var(--fg-muted);">{STAT1_LABEL}</div>
  </div>
  <!-- 统计 2 -->
  <div class="card" style="text-align:center;padding:var(--space-xl);">
    <div class="text-gradient" style="font-size:var(--font-size-4xl);font-weight:var(--font-weight-black);font-family:var(--font-mono);line-height:1;">{STAT2_VALUE}</div>
    <div style="margin-top:var(--space-sm);font-size:var(--font-size-sm);color:var(--fg-muted);">{STAT2_LABEL}</div>
  </div>
  <!-- 统计 3 -->
  <div class="card" style="text-align:center;padding:var(--space-xl);">
    <div class="text-gradient" style="font-size:var(--font-size-4xl);font-weight:var(--font-weight-black);font-family:var(--font-mono);line-height:1;">{STAT3_VALUE}</div>
    <div style="margin-top:var(--space-sm);font-size:var(--font-size-sm);color:var(--fg-muted);">{STAT3_LABEL}</div>
  </div>
</section>
