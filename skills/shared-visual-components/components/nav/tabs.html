<!-- ============================================================
  shared-visual-components / components/nav/tabs.html
  标签切换 — 片段（嵌入 layout 使用）
  ============================================================ -->
<div class="tabs" style="padding:var(--space-lg);">
  <div class="tab-buttons" style="display:flex;gap:var(--space-xs);border-bottom:2px solid color-mix(in srgb,var(--fg-muted) 20%,transparent);margin-bottom:var(--space-lg);">
    <button class="tab-btn active" data-tab="tab1" style="padding:10px 20px;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--fg-muted);transition:var(--transition-base);">标签一</button>
    <button class="tab-btn" data-tab="tab2" style="padding:10px 20px;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--fg-muted);transition:var(--transition-base);">标签二</button>
    <button class="tab-btn" data-tab="tab3" style="padding:10px 20px;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--fg-muted);transition:var(--transition-base);">标签三</button>
  </div>
  <div class="tab-panel" id="tab1" style="display:block;padding:var(--space-lg);background:var(--bg-elevated);border-radius:var(--radius-lg);">{TAB1_CONTENT}</div>
  <div class="tab-panel" id="tab2" style="display:none;padding:var(--space-lg);background:var(--bg-elevated);border-radius:var(--radius-lg);">{TAB2_CONTENT}</div>
  <div class="tab-panel" id="tab3" style="display:none;padding:var(--space-lg);background:var(--bg-elevated);border-radius:var(--radius-lg);">{TAB3_CONTENT}</div>
</div>
<script>
  (function () {
    var btns = document.querySelectorAll(".tab-btn");
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        btns.forEach(function (x) {
          x.classList.remove("active");
          x.style.color = "var(--fg-muted)";
          x.style.borderColor = "transparent";
        });
        b.classList.add("active");
        b.style.color = "var(--accent)";
        b.style.borderColor = "var(--accent)";
        document.querySelectorAll(".tab-panel").forEach(function (p) { p.style.display = "none"; });
        var target = document.getElementById(b.dataset.tab);
        if (target) target.style.display = "block";
      });
    });
  })();
</script>
