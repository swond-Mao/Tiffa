<!-- ============================================================

  渐变卡片 — 片段（嵌入 layout 使用）
  ============================================================ -->
<section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-md);padding:var(--space-lg);">
  <!-- 渐变卡片 1 -->
  <div style="background:var(--accent-gradient);border-radius:var(--radius-lg);padding:var(--space-xl);color:#fff;transition:var(--transition-base);">
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD1_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);opacity:0.9;">{CARD1_BODY}</p>
  </div>
  <!-- 渐变卡片 2 -->
  <div style="background:var(--accent-gradient);border-radius:var(--radius-lg);padding:var(--space-xl);color:#fff;transition:var(--transition-base);">
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD2_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);opacity:0.9;">{CARD2_BODY}</p>
  </div>
  <!-- 渐变卡片 3 -->
  <div style="background:var(--accent-gradient);border-radius:var(--radius-lg);padding:var(--space-xl);color:#fff;transition:var(--transition-base);">
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD3_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);opacity:0.9;">{CARD3_BODY}</p>
  </div>
</section>
