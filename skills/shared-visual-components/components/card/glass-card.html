<!-- ============================================================
  shared-visual-components / components/card/glass-card.html
  毛玻璃卡片 — 片段（不含 <html> 外壳，嵌入 layout 使用）
  用法：复制 <section class="cards"> 块到你的页面，
        页面需引入 core/*.css + themes/<主题>.css
  ============================================================ -->
<section class="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-md);padding:var(--space-lg);">
  <!-- 卡片 1 -->
  <div class="glass card" style="border-radius:var(--radius-lg);padding:var(--space-lg);transition:var(--transition-base);">
    <div style="font-size:var(--font-size-2xl);margin-bottom:var(--space-md);">🎨</div>
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD1_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);line-height:var(--line-height-normal);">{CARD1_BODY}</p>
  </div>
  <!-- 卡片 2 -->
  <div class="glass card" style="border-radius:var(--radius-lg);padding:var(--space-lg);transition:var(--transition-base);">
    <div style="font-size:var(--font-size-2xl);margin-bottom:var(--space-md);">⚡</div>
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD2_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);line-height:var(--line-height-normal);">{CARD2_BODY}</p>
  </div>
  <!-- 卡片 3 -->
  <div class="glass card" style="border-radius:var(--radius-lg);padding:var(--space-lg);transition:var(--transition-base);">
    <div style="font-size:var(--font-size-2xl);margin-bottom:var(--space-md);">🚀</div>
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD3_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);line-height:var(--line-height-normal);">{CARD3_BODY}</p>
  </div>
</section>
