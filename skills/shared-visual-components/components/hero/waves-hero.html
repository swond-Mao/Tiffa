<!-- ============================================================
  shared-visual-components / components/hero/waves-hero.html
  波浪背景封面 Hero — 纯 SVG，无外部依赖
  用法：复制到项目，替换 {TITLE}/{SUBTITLE}，设置 data-theme
  ============================================================ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<link rel="stylesheet" href="{BASE}/core/reset.css">
<link rel="stylesheet" href="{BASE}/core/variables.css">
<link rel="stylesheet" href="{BASE}/core/utils.css">
<link rel="stylesheet" href="{BASE}/themes/{THEME}.css">
<style>
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: var(--bg-primary);
  }
  .waves {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40vh;
    z-index: 0;
    opacity: 0.4;
  }
  .waves path {
    animation: wave-drift 10s ease-in-out infinite alternate;
  }
  .waves path:nth-child(2) { animation-delay: -3s; opacity: 0.6; }
  .waves path:nth-child(3) { animation-delay: -6s; opacity: 0.8; }
  @keyframes wave-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-40px); }
  }
  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 800px;
    padding: var(--space-2xl) var(--space-lg);
  }
  .hero-kicker {
    font-size: var(--font-size-sm);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: var(--space-md);
    font-weight: var(--font-weight-semibold);
  }
  .hero-title {
    font-size: var(--cover-title-size, var(--font-size-5xl));
    font-weight: var(--font-weight-heading, var(--font-weight-black));
    line-height: var(--line-height-tight);
    margin-bottom: var(--space-lg);
  }
  .hero-subtitle {
    font-size: var(--cover-subtitle-size, var(--font-size-lg));
    color: var(--fg-muted);
    font-weight: var(--font-weight-body, var(--font-weight-light));
    margin-bottom: var(--space-xl);
  }
</style>
</head>
<body data-theme="{THEME}">
  <section class="hero">
    <svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="var(--accent)" fill-opacity="0.3" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L0,320Z"></path>
      <path fill="var(--accent-2, var(--accent))" fill-opacity="0.4" d="M0,256L48,240C96,224,192,192,288,197.3C384,203,480,245,576,256C672,267,768,245,864,224C960,203,1056,181,1152,186.7C1248,192,1344,224,1392,240L1440,256L1440,320L0,320Z"></path>
      <path fill="var(--accent)" fill-opacity="0.5" d="M0,288L48,272C96,256,192,224,288,224C384,224,480,256,576,261.3C672,267,768,245,864,240C960,235,1056,245,1152,250.7C1248,256,1344,256,1392,256L1440,256L1440,320L0,320Z"></path>
    </svg>
    <div class="hero-content">
      <div class="hero-kicker">{KICKER}</div>
      <h1 class="hero-title text-gradient">{TITLE}</h1>
      <p class="hero-subtitle">{SUBTITLE}</p>
      <div class="hero-cta">
        <a href="#main" class="btn">{CTA_PRIMARY}</a>
        <a href="#more" class="btn btn-outline">{CTA_SECONDARY}</a>
      </div>
    </div>
  </section>
  <main id="main">
    <!-- 在此处放置你的内容 -->
  </main>
</body>
</html>
