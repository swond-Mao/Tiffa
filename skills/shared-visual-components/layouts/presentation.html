<!-- ============================================================
  shared-visual-components / layouts/presentation.html
  网页演示文稿 — 多页翻页 + 进度条 + 全屏
  用途：交互式 HTML 网页演示（替代 pptgen 的完整框架）
  用法：设置 data-theme，复制 .slide 块添加页面
  ============================================================ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<link rel="stylesheet" href="{BASE}/core/reset.css">
<link rel="stylesheet" href="{BASE}/core/variables.css">
<link rel="stylesheet" href="{BASE}/core/utils.css">
<link rel="stylesheet" href="{BASE}/themes/{THEME}.css">
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; }

  .deck {
    width: 100%;
    height: 100%;
    position: relative;
    background: var(--bg-primary);
  }

  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    transform: translateX(40px);
    background: var(--bg-primary);
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  .slide .inner { width: 100%; max-width: 1000px; margin: 0 auto; }

  /* ── 封面页 ── */
  .slide-cover { text-align: center; }
  .slide-cover .title {
    font-size: var(--font-size-5xl);
    font-weight: var(--font-weight-black);
    line-height: var(--line-height-tight);
    margin-bottom: var(--space-md);
  }
  .slide-cover .subtitle {
    font-size: var(--font-size-xl);
    color: var(--fg-muted);
    font-weight: var(--font-weight-light);
    margin-bottom: var(--space-lg);
  }
  .slide-cover .meta { font-size: var(--font-size-sm); color: var(--fg-faint); }

  /* ── 章节页 ── */
  .slide-section { text-align: center; }
  .slide-section .section-num {
    font-size: var(--font-size-5xl);
    font-weight: var(--font-weight-black);
    color: color-mix(in srgb, var(--accent) 15%, transparent);
    line-height: 1;
    margin-bottom: var(--space-sm);
    font-family: var(--font-mono);
  }
  .slide-section .title { font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); }

  /* ── 内容页 ── */
  .slide-content .title { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); margin-bottom: var(--space-md); }
  .slide-content .body { font-size: var(--font-size-base); line-height: var(--line-height-loose); color: var(--fg-muted); max-width: 750px; }
  .slide-content .body ul { padding-left: var(--space-lg); list-style: none; }
  .slide-content .body ul li::before { content: "▸ "; color: var(--accent); }
  .slide-content .body ul li { margin-bottom: var(--space-xs); }

  /* ── 左右分栏 ── */
  .slide-side { display: flex; gap: var(--space-xl); align-items: center; }
  .slide-side .text-col { flex: 1; }
  .slide-side .text-col .title { font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); margin-bottom: var(--space-md); }
  .slide-side .text-col .body { font-size: var(--font-size-base); line-height: var(--line-height-loose); color: var(--fg-muted); }
  .slide-side .img-col {
    flex: 1;
    min-height: 300px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .slide-side .img-col img { width: 100%; height: 100%; object-fit: cover; }

  /* ── 双栏 ── */
  .slide-2col { display: flex; gap: var(--space-lg); }
  .slide-2col .col { flex: 1; }
  .slide-2col .col .col-title { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); margin-bottom: var(--space-sm); }

  /* ── 引用页 ── */
  .slide-quote { text-align: center; max-width: 750px; margin: 0 auto; }
  .slide-quote .quote-text {
    font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-light);
    line-height: var(--line-height-loose);
    font-style: italic;
    margin-bottom: var(--space-md);
  }
  .slide-quote .quote-text::before { content: "\201C"; color: var(--accent); font-size: var(--font-size-5xl); opacity: .3; }
  .slide-quote .quote-text::after { content: "\201D"; color: var(--accent); font-size: var(--font-size-5xl); opacity: .3; }
  .slide-quote .quote-source { font-size: var(--font-size-sm); color: var(--fg-muted); }

  /* ── 数据页 ── */
  .slide-data { text-align: center; }
  .slide-data .big-number {
    font-size: var(--font-size-5xl);
    font-weight: var(--font-weight-black);
    line-height: 1;
    margin-bottom: var(--space-xs);
    font-family: var(--font-mono);
  }
  .slide-data .data-label { font-size: var(--font-size-base); color: var(--fg-muted); letter-spacing: 1px; }

  /* ── 全屏图 ── */
  .slide-image-full { position: relative; overflow: hidden; }
  .slide-image-full .img-bg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .slide-image-full .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.65), rgba(0,0,0,0.2));
  }
  .slide-image-full .inner { position: relative; z-index: 1; text-align: center; }
  .slide-image-full .title { font-size: var(--font-size-4xl); font-weight: var(--font-weight-bold); color: #fff; margin-bottom: var(--space-md); }
  .slide-image-full .sub { font-size: var(--font-size-lg); color: rgba(255,255,255,0.6); }

  /* ── 导航控件 ── */
  .arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    z-index: var(--z-raised);
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    color: var(--fg-muted);
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: var(--transition-base);
  }
  .arrow:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-md); }
  .arrow-left { left: 16px; }
  .arrow-right { right: 16px; }
  .arrow.hidden { display: none; }

  .progress {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: var(--z-raised);
  }
  .progress .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: color-mix(in srgb, var(--fg-muted) 30%, transparent);
    cursor: pointer; transition: var(--transition-base);
  }
  .progress .dot.active { background: var(--accent); width: 20px; border-radius: 3px; }

  .slide-num {
    position: fixed; bottom: 24px; right: 32px;
    font-size: var(--font-size-xs);
    color: var(--fg-faint);
    font-family: var(--font-mono);
    z-index: var(--z-raised);
  }
  .hint {
    position: fixed; bottom: 24px; left: 32px;
    font-size: var(--font-size-xs);
    color: var(--fg-faint);
    z-index: var(--z-raised);
    opacity: 0.4;
  }

  /* ── 内容卡片（复用） ── */
  .content-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); margin-top: var(--space-lg); }
  .content-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(var(--glass-blur));
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    transition: var(--transition-base);
  }
  .content-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .content-card .card-title { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); margin-bottom: var(--space-sm); }
  .content-card .card-body { font-size: var(--font-size-sm); color: var(--fg-muted); line-height: var(--line-height-normal); }
</style>
</head>
<body data-theme="{THEME}">
  <div class="deck">
    <!-- 示例页面：复制 .slide 块替换内容 -->
    <div class="slide slide-cover active">
      <div class="inner">
        <h1 class="title text-gradient">{TITLE}</h1>
        <p class="subtitle">{SUBTITLE}</p>
        <div class="meta">{META}</div>
      </div>
    </div>
    <div class="slide slide-content">
      <div class="inner">
        <h2 class="title">第一章 {SECTION_TITLE}</h2>
        <div class="body">
          <p>{CONTENT}</p>
        </div>
      </div>
    </div>
    <div class="slide slide-2col">
      <div class="inner">
        <div class="slide-2col">
          <div class="col">
            <h3 class="col-title">{COL1_TITLE}</h3>
            <div class="body">{COL1_CONTENT}</div>
          </div>
          <div class="col">
            <h3 class="col-title">{COL2_TITLE}</h3>
            <div class="body">{COL2_CONTENT}</div>
          </div>
        </div>
      </div>
    </div>
    <!-- 更多页面：复制上面的 .slide 块 -->
  </div>

  <button class="arrow arrow-left" id="arrowLeft">&lsaquo;</button>
  <button class="arrow arrow-right" id="arrowRight">&rsaquo;</button>
  <div class="progress" id="progress"></div>
  <div class="slide-num" id="slideNum"></div>
  <div class="hint">&larr; &rarr; 翻页 &middot; F 全屏</div>

  <script>
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
      var current = 0;
      var arrowLeft = document.getElementById("arrowLeft");
      var arrowRight = document.getElementById("arrowRight");
      var progress = document.getElementById("progress");
      var slideNum = document.getElementById("slideNum");

      // 构建进度点
      slides.forEach(function (_, i) {
        var dot = document.createElement("div");
        dot.className = "dot" + (i === 0 ? " active" : "");
        dot.addEventListener("click", function () { go(i); });
        progress.appendChild(dot);
      });

      function go(idx) {
        if (idx < 0 || idx >= slides.length) return;
        current = idx;
        slides.forEach(function (s, i) { s.classList.toggle("active", i === current); });
        arrowLeft.classList.toggle("hidden", current === 0);
        arrowRight.classList.toggle("hidden", current === slides.length - 1);
        var dots = progress.children;
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("active", i === current);
        slideNum.textContent = (current + 1) + " / " + slides.length;
      }

      arrowLeft.addEventListener("click", function () { go(current - 1); });
      arrowRight.addEventListener("click", function () { go(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(current + 1); }
        else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(current - 1); }
        else if (e.key === "f" || e.key === "F") { toggleFullscreen(); }
        else if (e.key === "Home") { go(0); }
        else if (e.key === "End") { go(slides.length - 1); }
      });

      function toggleFullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }

      go(0);
    })();
  </script>
</body>
</html>
