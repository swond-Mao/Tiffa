<!-- ============================================================
  shared-visual-components / layouts/poster-1080x1440.html
  竖版海报 3:4 — 1080×1440
  用途：社交媒体海报 / 活动宣传 / 产品推广
  用法：设置 <body data-theme="<主题id>">，替换 {TITLE} 等占位符，
        可叠加 hero 组件（把 hero 区块复制进来替换 .poster-hero）
  ============================================================ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<link rel="stylesheet" href="{BASE}/core/reset.css">
<link rel="stylesheet" href="{BASE}/core/variables.css">
<link rel="stylesheet" href="{BASE}/core/utils.css">
<link rel="stylesheet" href="{BASE}/themes/{THEME}.css">
<style>
  /* 固定画布尺寸 1080×1440，用 scale 自适应窗口 */
  body {
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .poster {
    width: 1080px;
    height: 1440px;
    background: var(--bg-primary);
    color: var(--fg-primary);
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    transform-origin: center center;
  }
  /* 自适应缩放脚本在底部 */
  @media (max-width: 1080px) {
    body { padding: 0; }
  }

  /* ── 海报内部布局 ── */
  .poster-inner {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 80px 64px;
  }

  /* 背景装饰层 */
  .poster-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 70% 40% at 80% 0%, var(--accent-gradient)),
      radial-gradient(ellipse 50% 40% at 0% 100%, var(--accent-2, var(--accent)));
    opacity: 0.12;
    filter: blur(50px);
  }

  /* 顶部区 */
  .poster-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: auto;
  }
  .poster-brand { font-size: var(--font-size-sm); letter-spacing: 0.2em; color: var(--fg-muted); font-weight: var(--font-weight-semibold); }
  .poster-date  { font-size: var(--font-size-sm); color: var(--fg-muted); }

  /* 中部主视觉 */
  .poster-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: var(--space-lg);
  }
  .poster-kicker {
    font-size: var(--font-size-base);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: var(--font-weight-semibold);
  }
  .poster-title {
    font-size: var(--font-size-5xl);
    font-weight: var(--font-weight-black);
    line-height: var(--line-height-tight);
    max-width: 90%;
  }
  .poster-subtitle {
    font-size: var(--font-size-xl);
    color: var(--fg-muted);
    font-weight: var(--font-weight-light);
    max-width: 80%;
  }
  .poster-divider {
    width: 64px;
    height: 4px;
    border-radius: var(--radius-full);
    background: var(--accent-gradient);
  }

  /* 底部信息 */
  .poster-bottom {
    margin-top: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }
  .poster-cta {
    font-size: var(--font-size-lg);
    color: var(--fg-primary);
  }
  .poster-meta {
    font-size: var(--font-size-sm);
    color: var(--fg-faint);
  }

  /* 主图占位（若需要 AI 生图） */
  .poster-image {
    width: 100%;
    max-width: 520px;
    aspect-ratio: 4/3;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .poster-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body data-theme="{THEME}">
  <div class="poster" id="poster">
    <div class="poster-bg"></div>
    <div class="poster-inner">
      <div class="poster-top">
        <div class="poster-brand">{BRAND}</div>
        <div class="poster-date">{DATE}</div>
      </div>
      <div class="poster-main">
        <div class="poster-kicker">{KICKER}</div>
        <h1 class="poster-title text-gradient">{TITLE}</h1>
        <div class="poster-divider"></div>
        <p class="poster-subtitle">{SUBTITLE}</p>
        <!-- 需要主图时取消注释并填 {IMAGE_URL}
        <div class="poster-image"><img src="{IMAGE_URL}" alt=""></div>
        -->
      </div>
      <div class="poster-bottom">
        <div class="poster-cta">{CTA}</div>
        <div class="poster-meta">{META}</div>
      </div>
    </div>
  </div>

  <!-- 自适应缩放：让 1080×1440 在任何窗口完整显示 -->
  <script>
    (function () {
      function fit() {
        var p = document.getElementById("poster");
        var s = Math.min(window.innerWidth / 1100, window.innerHeight / 1460, 1);
        p.style.transform = "scale(" + s + ")";
      }
      window.addEventListener("resize", fit);
      fit();
    })();
  </script>
</body>
</html>
