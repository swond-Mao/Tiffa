<!-- ============================================================
  shared-visual-components / effects/interactions/tilt-card.html
  3D 倾斜卡片 — 片段（含 JS）
  用法：<div class="tilt">内容</div>
  ============================================================ -->
<style>
  .tilt {
    transform-style: preserve-3d;
    transform: perspective(800px) rotateX(0) rotateY(0);
    transition: transform 0.15s ease;
    will-change: transform;
  }
  .tilt-inner {
    transform: translateZ(30px);
  }
</style>
<div class="tilt" style="max-width:400px;">
  <div class="tilt-inner card" style="padding:var(--space-xl);text-align:center;">
    <div style="font-size:var(--font-size-4xl);margin-bottom:var(--space-md);">✨</div>
    <h3 style="font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);">{BODY}</p>
  </div>
</div>
<script>
  (function () {
    var els = document.querySelectorAll(".tilt");
    els.forEach(function (el) {
      el.addEventListener("mousemove", function (e) {
        var r = el.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - 0.5;
        var y = (e.clientY - r.top) / r.height - 0.5;
        el.style.transform = "perspective(800px) rotateX(" + (-y * 12) + "deg) rotateY(" + (x * 12) + "deg)";
      });
      el.addEventListener("mouseleave", function () {
        el.style.transform = "perspective(800px) rotateX(0) rotateY(0)";
      });
    });
  })();
</script>
