# omp config.yml — 主设置文件
# 与 opencode 便携包一致：家用模型为 default，Kimi 为 slow/reasoning

modelRoles:
  default: "llama.cpp/localmodel"
  smol: "llama.cpp/localmodel"
  slow: "kimi/kimi-k3"
  plan: "kimi/kimi-k3"
  vision: "kimi/kimi-k3"
  commit: "llama.cpp/localmodel"
  tiny: "xiaomi/mimo-v2.5"

# Mnemopi 记忆系统 — 三重记忆 + RAG 方案
# L1: USER.md（用户身份/偏好，零延迟注入）
# L2: MEMORY.md（全局事实索引，零延迟注入）
# L3: PROJECT.md（项目级记忆，零延迟注入）
# mnemopi: 全局 RAG，跨项目语义检索 + 压缩断片恢复
memory:
  backend: mnemopi
mnemopi:
  embeddingModel: "BAAI/bge-small-zh-v1.5"
  scoping: "per-project-tagged" # 双层召回：项目bank + 全局bank
  autoRecall: true # 每次会话首条消息自动召回相关记忆
  autoRetain: true
  retainEveryNTurns: 2
  recallLimit: 10
  injectionTokenLimit: 2000
snapcompact:
  shape: "silver16-bw" # 强制 CJK TrueType 网格：视觉模型读帧质量远优于 8on22-bw 位图（实测 stop vs length）

tools:
  approvalMode: yolo
