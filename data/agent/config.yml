# omp config.yml — 主设置文件
# 与 opencode 便携包一致：家用模型为 default，Kimi 为 slow/reasoning

modelRoles:
  default: "qwen/localmodel"
  smol: "qwen/localmodel"
  slow: "kimi/kimi-k3"
  plan: "kimi/kimi-k3"
  vision: "kimi/kimi-k3"
  commit: "qwen/localmodel"
  tiny: "xiaomi/mimo-v2.5"

# Mnemopi 记忆系统（v4.0 启用）
memory:
  backend: mnemopi
  mnemopi:
    embeddingModel: "fast-bge-small-zh-v1.5"
    scoping: "per-project-plus-global"
    autoRecall: true
    autoRetain: true
    retainEveryNTurns: 5
    recallLimit: 10
    injectionTokenLimit: 2000
tools:
  approvalMode: yolo
