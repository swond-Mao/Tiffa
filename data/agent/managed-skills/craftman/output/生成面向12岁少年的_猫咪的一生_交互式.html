<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱 猫咪的一生</title>
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #12182a;
      --bg-card: #161b35;
      --accent: #f0a030;
      --accent-glow: #f8c45c;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --border: rgba(240, 160, 48, 0.15);
      --radius: 16px;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      position: relative;
    }
    .bg-particles {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-particles .particle {
      position: absolute; width: 4px; height: 4px;
      background: var(--accent); border-radius: 50%;
      opacity: 0; animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(100vh) scale(0); }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.4; }
      100% { opacity: 0; transform: translateY(-10vh) scale(1); }
    }
    .container {
      max-width: 960px; margin: 0 auto;
      padding: 0 20px; position: relative; z-index: 1;
    }
    .header {
      text-align: center; padding: 60px 20px 30px;
    }
    .header .emoji {
      font-size: 5rem; display: block;
      animation: float 4s ease-in-out infinite;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(240, 160, 48, 0.5));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-18px) rotate(6deg); }
    }
    .header h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 800; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #f0a030, #f8c45c, #f0a030);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .header p {
      font-size: 1.15rem; color: var(--text-dim);
      max-width: 600px; margin: 0 auto;
      font-weight: 300;
    }
    .stage-bar {
      display: flex; justify-content: center; gap: 8px;
      margin: 10px 0 10px; flex-wrap: wrap;
    }
    .stage-bar .dot {
      width: 12px; height: 12px;
      border-radius: 50%; background: var(--bg-card);
      border: 2px solid var(--border); cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: var(--text-dim);
      position: relative;
    }
    .stage-bar .dot::after {
      content: ''; position: absolute; top: -14px; left: 50%;
      transform: translateX(-50%); width: 50%; height: 1px;
      background: var(--bg-card);
    }
    .stage-bar .dot.active {
      background: var(--accent); border-color: var(--accent-glow);
      color: #000; box-shadow: 0 0 10px rgba(240, 160, 48, 0.4);
    }
    .stage-bar .dot.active::after { background: var(--accent); }
    .stage-nav {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .stage-nav .btn-prev,
    .stage-nav .btn-next {
      width: 44px; height: 44px;
      border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); font-size: 1.1rem;
    }
    .stage-nav .btn-prev:hover,
    .stage-nav .btn-next:hover {
      border-color: var(--accent); background: rgba(240, 160, 48, 0.1);
    }
    .stage-nav .btn-prev:disabled,
    .stage-nav .btn-next:disabled {
      opacity: 0.3; cursor: not-allowed;
    }
    .content-wrapper { padding: 20px 0 60px; }
    .stage-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .stage-card.visible {
      opacity: 1; transform: translateY(0);
    }
    .stage-card-header {
      display: flex; align-items: center; gap: 16px;
      padding: 24px 28px; border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .stage-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(240, 160, 48, 0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; flex-shrink: 0;
    }
    .stage-info { flex: 1; }
    .stage-info .stage-title {
      font-size: 1.5rem; font-weight: 700;
      color: var(--accent); margin-bottom: 6px;
    }
    .stage-info .stage-age {
      font-size: 0.9rem; color: var(--text-dim);
      font-weight: 400;
    }
    .stage-content { padding: 24px 28px; }
    .stage-content h2 {
      font-size: 1.1rem; color: var(--accent);
      margin-bottom: 12px; letter-spacing: 0.02em;
    }
    .stage-content .story {
      color: var(--text); line-height: 1.8;
      margin-bottom: 18px; font-size: 1rem;
    }
    .stage-facts {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .fact-item {
      background: var(--bg-primary); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      transition: var(--transition);
    }
    .fact-item:hover {
      border-color: var(--accent); transform: translateY(-2px);
    }
    .fact-item .label {
      font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--accent);
      margin-bottom: 4px;
    }
    .fact-item .value {
      font-size: 0.9rem; color: var(--text);
    }
    .stage-image-wrapper {
      padding: 20px 28px 24px; text-align: center;
    }
    .stage-image-wrapper .cat-img {
      font-size: 4rem; display: block;
      animation: float 4s ease-in-out infinite;
    }
    .accordion {
      border: 1px solid var(--border);
      border-radius: var(--radius); margin-top: 10px;
      cursor: pointer; transition: var(--transition);
    }
    .accordion:hover { border-color: var(--accent); }
    .accordion header {
      padding: 14px 18px; display: flex;
      justify-content: space-between; align-items: center;
      font-size: 0.9rem; color: var(--accent);
      font-weight: 600; user-select: none;
    }
    .accordion .chevron {
      font-size: 0.7rem; transition: transform 0.3s ease;
    }
    .accordion.open .chevron { transform: rotate(180deg); }
    .accordion.open .accordion-body { display: block; }
    .accordion-body {
      display: none; padding: 0 18px 14px 18px;
      font-size: 0.9rem; color: var(--text);
      line-height: 1.7;
    }
    .accordion.open .accordion-body { display: block; }
  </style>
</head>
<body>
  <div class="bg-particles" id="particles"></div>
  <div class="container">
    <div class="header">
      <span class="emoji">🐱</span>
      <h1>猫咪的一生</h1>
      <p>从小猫到老年猫，探索猫咪一生的奇妙 journey 🐾</p>
    </div>

    <div class="stage-bar" id="stageBar"></div>
    <div class="stage-nav">
      <button class="btn-prev" id="btnPrev" onclick="prevStage()">◀</button>
      <button class="btn-next" id="btnNext" onclick="nextStage()">▶</button>
      <button class="btn-prev" id="btnRandom" onclick="randomStage()">🎲</button>
    </div>

    <div class="content-wrapper" id="contentWrapper"></div>
  </div>

  <script>
    const stages = [
      {
        id: "kitten",
        title: " kitten (1-3个月)",
        emoji: "👶",
        age: "1～3个月",
        accent: "#f0a030",
        story: " kitten 是世界上的第一个生命，从妈妈口中第一口奶开始。这个时期的小猫是好奇、活泼且容易受惊的。它们喜欢探索周围的一切，用耳朵竖起来来捕捉声音，用尾巴探索空间。",
        facts: [
          { label: "体重", value: "约 30～70 克" },
          { label: "视力", value: "可辨别 1～2 米以内的目标" },
          { label: "听力", value: "能听到 30～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 200～300 米" }
        ],
        details: " kitten 阶段是猫咪一生的起点。它们出生时只有约 3 克，只有 1.5 cm 长，视力仅能辨别 1～2 米以内的事物。但它们的听力极为敏锐，能听到 30～60 赫兹的超声波。每次喂养后， kitten 会疯狂打嗾，因为妈妈刚喂了 10 倍其体重的牛奶！"
      },
      {
        id: "kitten",
        title: " kitten (3-6个月)",
        emoji: "🐈",
        age: "3～6个月",
        accent: "#e8407f",
        story: " kittens 开始学习基本行为。它们开始学会打毛、使用 litter box、追逐玩球。这个时期的小猫非常活跃，喜欢扑玩、咬咬、追踪。",
        facts: [
          { label: "体重", value: "约 0.3～1.2 千克" },
          { label: "视力", value: "可辨别 10 米以内的目标" },
          { label: "听力", value: "能听到 3～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 300～600 米" }
        ],
        details: " kitten 阶段是小猫开始探索世界的阶段。它们开始学会打毛、使用 litter box。 kittens 非常活跃，喜欢追球、咬咬、跳跃。它们开始学习妈妈的声音，并建立信任。"
      },
      {
        id: "juvenile",
        title: "少年阶段",
        emoji: "🐱",
        age: "7～12个月",
        accent: "#5b9cff",
        story: "少年阶段是活跃、好奇、喜欢探索的阶段。它们喜欢冒险，喜欢探索新的地方、新的动物、新的高处。",
        facts: [
          { label: "体重", value: "约 1.2～3.5 千克" },
          { label: "视力", value: "可辨别 100 米以内的目标" },
          { label: "听力", value: "能听到 3～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 600～1200 米" }
        ],
        details: "少年阶段是猫咪最活跃、最具探索精神的时期。 kittens 开始学习更多行为：咬、扑、追踪、跳跃。它们开始独立探索，寻找新的高处、新的朋友。"
      },
      {
        id: "adolescent",
        title: "青春期",
        emoji: "😈",
        age: "1～3 岁",
        accent: "#f04040",
        story: "青春期猫咪是最具挑战性的阶段之一。它们开始性成熟，行为变得更加活跃和不可预测。",
        facts: [
          { label: "体重", value: "约 3.5～5.5 千克" },
          { label: "视力", value: "能辨别 1000 米以内的目标" },
          { label: "听力", value: "能听到 3～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 1200～2400 米" }
        ],
        details: "青春期猫咪是猫咪生命周期中最具挑战性的阶段之一。它们开始性成熟，行为变得更加活跃和不可预测。"
      },
      {
        id: "adult",
        title: "成人阶段",
        emoji: "🧓",
        age: "4～12 岁",
        accent: "#40c040",
        story: "成年猫咪最稳定、最成熟的阶段。他们已经确定了自己的角色，对家里、自己的领地、自己的节奏。",
        facts: [
          { label: "权重", value: "约 3.5～5.5 千克（纯体）" },
          { label: "视力", value: "能辨别 1000 米以内的目标" },
          { label: "听力", value: "能听到 3～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 2000～4000 米" }
        ],
        details: "成年猫咪最稳定、最成熟的阶段。他们已经确定了自己的角色，对家里、自己的领地、自己的节奏。"
      },
      {
        id: "senior",
        title: "老年阶段",
        emoji: "🐶",
        age: "13～15 岁",
        accent: "#c04040",
        story: "老年猫咪最稳定、最平静的阶段。它们开始更喜欢在熟悉的的地方休息，对变化不敏感。",
        facts: [
          { label: "权重", value: "约 3.5～5.5 千克" },
          { label: "视力", value: "能辨别 1000 米以内的目标" },
          { label: "听力", value: "能听到 3～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 400～800 米" }
        ],
        details: "老年猫咪最稳定、最平静的阶段。它们开始更喜欢在熟悉的的地方休息，对变化不敏感。"
      },
      {
        id: "elder",
        title: "老年阶段",
        emoji: "🧓",
        age: "15～20+ 岁",
        accent: "#804080",
        story: "老年猫咪最稳定、最平静的阶段。它们开始更喜欢在熟悉的的地方休息，对变化不敏感。",
        facts: [
          { label: "权重", value: "约 3.5～5.5 千克" },
          { label: "视力", value: "能辨别 1000 米以内的目标" },
          { label: "听力", value: "能听到 3～60 赫兹的超声波" },
          { label: "活动量", value: "平均 daily 400～800 米" }
        ],
        details: "老年猫咪最稳定、最平静的阶段。它们开始更喜欢在熟悉的的地方休息，对变化不敏感。"
      }
    ];

    let currentStage = 0;
    const stageBars = document.querySelectorAll('#stageBar .dot');
    const stageCards = document.querySelectorAll('#contentWrapper .stage-card');

    function renderStages() {
      stageBars.forEach((dot, i) => {
        dot.textContent = stages[i].id.charAt(0);
        dot.classList.toggle('active', i === currentStage);
      });
      updateCards();
    }

    function updateCards() {
      stageCards.forEach(card => card.classList.remove('open'));
      stageCards[currentStage].classList.add('open');
    }

    function updateContent() {
      const stage = stages[currentStage];
      stageCards.forEach(card => {
        card.className = 'stage-card visible';
      });
      stageCards.forEach(card => card.classList.remove('open'));
      stageCards[currentStage].classList.add('open');
    }

    function nextStage() {
      currentStage = (currentStage + 1) % stages.length;
      renderStages();
    }

    function prevStage() {
      currentStage = (currentStage - 1 + stages.length) % stages.length;
      renderStages();
    }

    function randomStage() {
      const random = Math.floor(Math.random() * stages.length);
      if (random !== currentStage) {
        currentStage = random;
        renderStages();
      }
    }

    function updateContent() {
      const stage = stages[currentStage];
      stageCards.forEach(card => {
        card.className = 'stage-card visible';
      });
      stageCards.forEach(card => card.classList.remove('open'));
      stageCards[currentStage].classList.add('open');
    }

    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
      renderStages();
      updateContent();
    });

    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
        container.appendChild(particle);
      }
    }
  </script>
</body>
</html>
