<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Segoe UI','Helvetica Neue',sans-serif;color:#1e293b}
.deck{width:100%;height:100%;position:relative}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:56px 72px;opacity:0;transition:opacity .45s ease;pointer-events:none;background:linear-gradient(135deg,var(--g1,#667eea),var(--g2,#764ba2))}
.slide.active{opacity:1;pointer-events:auto}
.slide .inner{width:100%;max-width:960px;margin:0 auto}
.slide-num{position:fixed;bottom:24px;right:32px;font-size:12px;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums;z-index:100;font-family:'SF Mono',Consolas,monospace;mix-blend-mode:overlay}
/* cover */
.slide-cover{text-align:center;--g1:#667eea;--g2:#764ba2}
.slide-cover .title{font-size:48px;font-weight:800;color:#fff;letter-spacing:-1px;margin-bottom:10px;line-height:1.15;text-shadow:0 2px 20px rgba(0,0,0,.15)}
.slide-cover .accent-line{width:50px;height:3px;background:rgba(255,255,255,.4);margin:0 auto 18px;border-radius:2px}
.slide-cover .subtitle{font-size:17px;color:rgba(255,255,255,.7);font-weight:400;letter-spacing:1px}
.slide-cover .meta{font-size:13px;color:rgba(255,255,255,.35);margin-top:28px}
/* section */
.slide-section{text-align:center;--g1:#2b5876;--g2:#4e4376}
.slide-section .section-num{font-size:88px;font-weight:800;color:rgba(255,255,255,.1);line-height:1;margin-bottom:-12px;font-family:'SF Mono',Consolas,monospace}
.slide-section .title{font-size:34px;font-weight:700;color:#fff}
.slide-section .accent-line{width:36px;height:2px;background:rgba(255,255,255,.35);margin:12px auto}
/* content */
.slide-content{--g1:#0f2027;--g2:#203a43}
.slide-content .card{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border-radius:16px;padding:36px 40px;border:1px solid rgba(255,255,255,.12)}
.slide-content .card .title{font-size:26px;font-weight:700;color:#fff;margin-bottom:14px}
.slide-content .card .title .num{color:rgba(255,255,255,.5);font-weight:500;margin-right:8px}
.slide-content .card .body{font-size:15px;line-height:1.8;color:rgba(255,255,255,.75)}
.slide-content .card .body p{margin-bottom:10px}
.slide-content .card .body ul{padding-left:18px;list-style:none}
.slide-content .card .body ul li::before{content:"✦ ";color:rgba(255,255,255,.5)}
.slide-content .card .body ul li{margin-bottom:5px}
/* content-left / content-right */
.slide-side{display:flex;gap:40px;align-items:center;--g1:#1a1a2e;--g2:#16213e}
.slide-side .text-col{flex:1}
.slide-side .text-col .card{background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border-radius:16px;padding:32px;border:1px solid rgba(255,255,255,.1)}
.slide-side .text-col .card .title{font-size:24px;font-weight:700;color:#fff;margin-bottom:12px}
.slide-side .text-col .card .body{font-size:14px;line-height:1.8;color:rgba(255,255,255,.7)}
.slide-side .text-col .card .body ul{padding-left:14px;list-style:none}
.slide-side .text-col .card .body ul li::before{content:"✦ ";color:rgba(255,255,255,.4)}
.slide-side .img-col{flex:1;min-height:280px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.slide-side .img-col img{width:100%;height:100%;object-fit:cover;display:block}
.slide-side .img-col .img-placeholder{color:rgba(255,255,255,.2);font-size:14px;display:flex;align-items:center;justify-content:center;height:100%;min-height:280px}
/* two-column */
.slide-2col{display:flex;gap:28px;--g1:#2c3e50;--g2:#3498db}
.slide-2col .col{flex:1}
.slide-2col .col .card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border-radius:14px;padding:28px;border:1px solid rgba(255,255,255,.08)}
.slide-2col .col .card .col-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:10px}
.slide-2col .col .card .col-title .num{color:rgba(255,255,255,.4)}
.slide-2col .col .card .body{font-size:13px;line-height:1.7;color:rgba(255,255,255,.65)}
.slide-2col .col .card .body ul{padding-left:14px;list-style:none}
.slide-2col .col .card .body ul li::before{content:"✦ ";color:rgba(255,255,255,.35)}
/* quote */
.slide-quote{text-align:center;--g1:#0f0c29;--g2:#302b63}
.slide-quote .quote-text{font-size:30px;font-weight:300;line-height:1.7;color:#fff;font-style:italic;margin-bottom:12px;max-width:750px;margin-left:auto;margin-right:auto}
.slide-quote .quote-text::before{content:"\201C";font-size:48px;opacity:.3;margin-right:4px;vertical-align:middle}
.slide-quote .quote-text::after{content:"\201D";font-size:48px;opacity:.3;margin-left:4px;vertical-align:middle}
.slide-quote .quote-source{font-size:14px;color:rgba(255,255,255,.4)}
/* data */
.slide-data{text-align:center;--g1:#c31432;--g2:#240b36}
.slide-data .big-number{font-size:88px;font-weight:800;color:#fff;line-height:1;margin-bottom:4px;font-family:'SF Mono',Consolas,monospace;text-shadow:0 2px 30px rgba(0,0,0,.2)}
.slide-data .data-label{font-size:15px;color:rgba(255,255,255,.6);margin-bottom:8px;letter-spacing:2px;text-transform:uppercase}
.slide-data .data-desc{font-size:15px;color:rgba(255,255,255,.4);max-width:400px;margin:0 auto;line-height:1.6}
/* image full */
.slide-image-full{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.slide-image-full .img-bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.slide-image-full .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(0,0,0,.65),rgba(0,0,0,.2))}
.slide-image-full .inner{position:relative;z-index:1;text-align:center}
.slide-image-full .title{font-size:40px;font-weight:700;color:#fff;margin-bottom:10px;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.slide-image-full .sub{font-size:16px;color:rgba(255,255,255,.6)}
/* arrows */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:100;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s;backdrop-filter:blur(8px)}
.arrow:hover{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.35)}
.arrow-left{left:12px}
.arrow-right{right:12px}
.arrow.hidden{display:none}
/* progress */
.progress{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:100}
.progress .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:.2s}
.progress .dot.active{background:#fff;width:22px;border-radius:3px}
/* hint */
.hint{position:fixed;bottom:24px;left:32px;font-size:11px;color:rgba(255,255,255,.2);z-index:100;mix-blend-mode:overlay}
</style>
</head>
<body>
<div class="deck">{SLIDES}</div>
<div class="arrow arrow-left" id="arrowLeft">&lsaquo;</div>
<div class="arrow arrow-right" id="arrowRight">&rsaquo;</div>
<div class="progress" id="progress"></div>
<div class="slide-num" id="slideNum"></div>
<div class="hint">&larr; &rarr;</div>
<script>
(function(){'use strict';
var s=document.querySelectorAll('.slide'),c=0,t=s.length;
function show(i){if(i<0||i>=t)return;s[c].classList.remove('active');s[i].classList.add('active');c=i;u();}
function u(){
  document.getElementById('slideNum').textContent=(c+1)+' / '+t;
  document.getElementById('arrowLeft').classList.toggle('hidden',c===0);
  document.getElementById('arrowRight').classList.toggle('hidden',c===t-1);
  document.querySelectorAll('.progress .dot').forEach(function(d,i){d.classList.toggle('active',i===c);});
}
function bp(){
  var el=document.getElementById('progress');
  for(var i=0;i<t;i++){var d=document.createElement('div');d.className='dot';d.onclick=function(j){return function(){show(j);};}(i);el.appendChild(d);}
}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(c+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(c-1);}
  if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
});
document.getElementById('arrowLeft').onclick=function(){show(c-1);};
document.getElementById('arrowRight').onclick=function(){show(c+1);};
var tx=0;document.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;});
document.addEventListener('touchend',function(e){var d=tx-e.changedTouches[0].screenX;if(Math.abs(d)>50){if(d>0)show(c+1);else show(c-1);}});
if(t>0)s[0].classList.add('active');bp();u();
})();
</script>
</body>
</html>
