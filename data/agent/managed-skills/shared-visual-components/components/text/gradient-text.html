  渐变文字 — 片段
  用法：<span class="gradient-text">文字</span>

<style>
  .gradient-text {
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
</style>
<span class="gradient-text" style="font-size:var(--font-size-2xl);font-weight:var(--font-weight-black);">{TEXT}</span>
