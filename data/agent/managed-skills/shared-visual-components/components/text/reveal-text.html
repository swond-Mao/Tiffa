<!-- ============================================================
  shared-visual-components / components/text/reveal-text.html
  文字逐行出现（滚动触发） — 片段（含 JS）
  用法：<div class="reveal-lines"><p>...</p><p>...</p></div>
  ============================================================ -->
<style>
  .reveal-lines p {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    margin-bottom: var(--space-md);
  }
  .reveal-lines p.in-view {
    opacity: 1;
    transform: translateY(0);
  }
</style>
<div class="reveal-lines" style="font-size:var(--font-size-xl);font-weight:var(--font-weight-light);line-height:var(--line-height-loose);color:var(--fg-primary);">
  <p>{LINE1}</p>
  <p>{LINE2}</p>
  <p>{LINE3}</p>
</div>
<script>
  (function () {
    var lines = document.querySelectorAll(".reveal-lines p");
    if (!("IntersectionObserver" in window)) {
      lines.forEach(function (l) { l.classList.add("in-view"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add("in-view");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.3 });
    lines.forEach(function (l) { io.observe(l); });
  })();
</script>
