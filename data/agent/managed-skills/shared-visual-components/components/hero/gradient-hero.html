<!-- ============================================================
  shared-visual-components / components/hero/gradient-hero.html
  渐变封面 Hero — 纯 CSS，无外部依赖
  用法：复制本文件到你的项目，替换 {TITLE}/{SUBTITLE}/{CTA}，
        在 <body> 设置 data-theme="<主题id>" 切换主题
  ============================================================ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{TITLE}</title>
<link rel="stylesheet" href="{BASE}/core/reset.css">
<link rel="stylesheet" href="{BASE}/core/variables.css">
<link rel="stylesheet" href="{BASE}/core/utils.css">
<link rel="stylesheet" href="{BASE}/themes/{THEME}.css">
<style>
  /* ── 封面 Hero 专属样式 ── */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: var(--bg-primary);
  }

  /* 装饰几何图形（纯 CSS，无外部依赖） */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, var(--accent-gradient)),
      radial-gradient(ellipse 50% 40% at 80% 80%, var(--accent-2, var(--accent)));
    opacity: 0.15;
    filter: blur(40px);
    animation: hero-breathe 8s ease-in-out infinite alternate;
  }

  @keyframes hero-breathe {
    from { transform: scale(1); opacity: 0.12; }
    to   { transform: scale(1.08); opacity: 0.2; }
  }

  /* 浮动圆环装饰 */
  .hero-ring {
    position: absolute;
    border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 50%;
    animation: ring-float 12s ease-in-out infinite alternate;
  }
  .hero-ring.r1 { width: 420px; height: 420px; top: -120px; left: -100px; }
  .hero-ring.r2 { width: 260px; height: 260px; bottom: -60px; right: -40px; animation-delay: -4s; }
  .hero-ring.r3 { width: 120px; height: 120px; top: 20%; right: 12%; animation-delay: -8s; }

  @keyframes ring-float {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(-30px) rotate(15deg); }
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 800px;
    padding: var(--space-2xl) var(--space-lg);
  }

  .hero-kicker {
    font-size: var(--font-size-sm);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: var(--space-md);
    font-weight: var(--font-weight-semibold);
  }

  .hero-title {
    font-size: var(--cover-title-size, var(--font-size-5xl));
    font-weight: var(--font-weight-heading, var(--font-weight-black));
    line-height: var(--line-height-tight);
    margin-bottom: var(--space-lg);
    color: var(--fg-primary);
  }

  .hero-subtitle {
    font-size: var(--cover-subtitle-size, var(--font-size-lg));
    color: var(--fg-muted);
    font-weight: var(--font-weight-body, var(--font-weight-light));
    margin-bottom: var(--space-xl);
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: var(--space-md);
  }
</style>
</head>
<body data-theme="{THEME}">
  <section class="hero">
    <div class="hero-ring r1"></div>
    <div class="hero-ring r2"></div>
    <div class="hero-ring r3"></div>
    <div class="hero-content">
      <div class="hero-kicker">{KICKER}</div>
      <h1 class="hero-title text-gradient">{TITLE}</h1>
      <p class="hero-subtitle">{SUBTITLE}</p>
      <div class="hero-cta">
        <a href="#main" class="btn">{CTA_PRIMARY}</a>
        <a href="#more" class="btn btn-outline">{CTA_SECONDARY}</a>
      </div>
    </div>
  </section>
  <main id="main">
    <!-- 在此处放置你的内容 -->
  </main>
</body>
</html>
