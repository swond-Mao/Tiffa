<!-- ============================================================
  shared-visual-components / components/grid/bento-grid.html
  便当盒网格 — 片段（嵌入 layout 使用）
  用法：复制 <section> 块，调整 grid-row/column 控制大小
  ============================================================ -->
<style>
  .bento {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 140px;
    gap: var(--space-md);
    padding: var(--space-lg);
  }
  .bento-item {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(var(--glass-blur));
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: var(--transition-base);
    position: relative;
    overflow: hidden;
  }
  .bento-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .bento-item.large { grid-row: span 2; grid-column: span 2; }
  .bento-item.tall { grid-row: span 2; }
  .bento-item .bento-title { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); margin-bottom: var(--space-xs); }
  .bento-item .bento-body { font-size: var(--font-size-sm); color: var(--fg-muted); }
  .bento-item .bento-num { position: absolute; top: 16px; right: 16px; font-size: var(--font-size-2xl); font-weight: var(--font-weight-black); opacity: 0.15; font-family: var(--font-mono); }
  @media (max-width: 768px) {
    .bento { grid-template-columns: 1fr 1fr; }
    .bento-item.large { grid-row: span 1; grid-column: span 2; }
  }
</style>
<section class="bento">
  <div class="bento-item large">
    <span class="bento-num">01</span>
    <div class="bento-title">{BENTO1_TITLE}</div>
    <div class="bento-body">{BENTO1_BODY}</div>
  </div>
  <div class="bento-item">
    <span class="bento-num">02</span>
    <div class="bento-title">{BENTO2_TITLE}</div>
    <div class="bento-body">{BENTO2_BODY}</div>
  </div>
  <div class="bento-item tall">
    <span class="bento-num">03</span>
    <div class="bento-title">{BENTO3_TITLE}</div>
    <div class="bento-body">{BENTO3_BODY}</div>
  </div>
  <div class="bento-item">
    <span class="bento-num">04</span>
    <div class="bento-title">{BENTO4_TITLE}</div>
    <div class="bento-body">{BENTO4_BODY}</div>
  </div>
  <div class="bento-item">
    <span class="bento-num">05</span>
    <div class="bento-title">{BENTO5_TITLE}</div>
    <div class="bento-body">{BENTO5_BODY}</div>
  </div>
</section>
