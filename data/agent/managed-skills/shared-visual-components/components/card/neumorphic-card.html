<!-- ============================================================
  shared-visual-components / components/card/neumorphic-card.html
  拟态卡片 — 片段（嵌入 layout 使用）
  用法：复制 <section> 块，需引入 neumorphism 主题
  ============================================================ -->
<section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-lg);padding:var(--space-lg);">
  <!-- 拟态卡片 1 -->
  <div style="background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--space-xl);box-shadow:8px 8px 16px rgba(0,0,0,0.08),-8px -8px 16px rgba(255,255,255,0.9);">
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD1_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);">{CARD1_BODY}</p>
  </div>
  <!-- 拟态卡片 2 -->
  <div style="background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--space-xl);box-shadow:8px 8px 16px rgba(0,0,0,0.08),-8px -8px 16px rgba(255,255,255,0.9);">
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD2_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);">{CARD2_BODY}</p>
  </div>
  <!-- 拟态卡片 3 -->
  <div style="background:var(--bg-primary);border-radius:var(--radius-lg);padding:var(--space-xl);box-shadow:8px 8px 16px rgba(0,0,0,0.08),-8px -8px 16px rgba(255,255,255,0.9);">
    <h3 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);margin-bottom:var(--space-sm);">{CARD3_TITLE}</h3>
    <p style="font-size:var(--font-size-sm);color:var(--fg-muted);">{CARD3_BODY}</p>
  </div>
</section>
