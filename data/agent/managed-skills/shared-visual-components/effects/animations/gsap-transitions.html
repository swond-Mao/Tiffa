<!-- ============================================================
  shared-visual-components / effects/animations/gsap-transitions.html
  GSAP 翻页过渡动画 — 4 种模式（提取自 dashiai-ppt）
  依赖：vendor/gsap.min.js（本地，离线可用）

  用法：
  1. 引入 <script src="{BASE}/vendor/gsap.min.js"></script>
  2. 引入本片段（含 JS，注册 __transition 全局函数）
  3. 调用 window.__transition(container, currentSlide, nextSlide, mode, direction)
     mode: "circle" | "pixelate" | "slices" | "parallax" | "fade"

  模式说明：
  - circle:    圆形遮罩展开（经典苹果风）
  - pixelate:  像素块扩散
  - slices:    垂直/水平切片滑动
  - parallax:  视差层叠（当前页缩小后移，新页放大进入）
  - fade:      淡入淡出（最轻量，无 GSAP 也可用 CSS 实现）
  ============================================================ -->
<script>
(function () {
  if (typeof window.gsap === "undefined") return;

  // prefers-reduced-motion 时跳过动画
  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // 通用：构建时间轴
  function playTimeline(build, onComplete) {
    var tl = window.gsap.timeline({ defaults: { ease: "power3.inOut" } });
    build(tl);
    tl.eventCallback("onComplete", onComplete);
    return tl;
  }

  var TRANSITIONS = {
    // ── 圆形遮罩展开 ──
    circle: function (ctx) {
      var focusX = ctx.direction > 0 ? "58%" : "42%";
      window.gsap.set(ctx.next, {
        scale: 1.02,
        xPercent: 1.4 * ctx.direction,
        filter: "blur(18px)",
        clipPath: "circle(0% at " + focusX + " 52%)",
        autoAlpha: 1
      });
      return playTimeline(function (tl) {
        tl.to(ctx.current, { xPercent: -1.2 * ctx.direction, scale: 0.985, filter: "blur(12px)", autoAlpha: 0.18, duration: 0.45 }, 0)
          .to(ctx.next, { clipPath: "circle(142% at " + focusX + " 52%)", xPercent: 0, filter: "blur(0px)", scale: 1, duration: 0.58, ease: "power4.inOut" }, 0)
          .add(function () { ctx.commit(); }, 0.35);
      }, ctx.done);
    },

    // ── 像素块扩散 ──
    pixelate: function (ctx) {
      var cols = 12, rows = 6;
      var cells = [];
      var i, j;
      for (i = 0; i < cols; i++) {
        for (j = 0; j < rows; j++) {
          var cell = document.createElement("div");
          cell.style.cssText = "position:absolute;top:" + (j * 100 / rows) + "%;left:" + (i * 100 / cols) + "%;width:" + (100 / cols) + "%;height:" + (100 / rows) + "%;background:#0a0a0f;opacity:0;";
          ctx.stage.appendChild(cell);
          cells.push(cell);
        }
      }
      window.gsap.set(ctx.next, { autoAlpha: 1 });
      return playTimeline(function (tl) {
        tl.set(cells, { autoAlpha: 1, transformOrigin: "center" })
          .to(cells, { scale: 0, autoAlpha: 0, duration: 0.5, stagger: { each: 0.01, from: "random" } })
          .add(function () { ctx.commit(); }, 0.45);
      }, ctx.done);
    },

    // ── 切片滑动 ──
    slices: function (ctx) {
      var orientation = ctx.orientation || "horizontal";
      var slices = [];
      var i, count = 8;
      for (i = 0; i < count; i++) {
        var s = document.createElement("div");
        if (orientation === "horizontal") {
          s.style.cssText = "position:absolute;left:" + (i * 100 / count) + "%;top:0;width:" + (100 / count + 0.5) + "%;height:100%;background:#0a0a0f;";
        } else {
          s.style.cssText = "position:absolute;top:" + (i * 100 / count) + "%;left:0;height:" + (100 / count + 0.5) + "%;width:100%;background:#0a0a0f;";
        }
        ctx.stage.appendChild(s);
        slices.push(s);
      }
      window.gsap.set(ctx.next, { autoAlpha: 1 });
      var showFrom = ctx.direction > 0 ? 100 : -100;
      return playTimeline(function (tl) {
        tl.set(slices, {
          autoAlpha: 1,
          xPercent: orientation === "horizontal" ? showFrom : 0,
          yPercent: orientation === "vertical" ? showFrom : 0
        })
        .to(slices, { xPercent: 0, yPercent: 0, duration: 0.6, stagger: 0.04, ease: "power4.inOut" })
        .add(function () { ctx.commit(); }, 0.5);
      }, ctx.done);
    },

    // ── 视差层叠 ──
    parallax: function (ctx) {
      window.gsap.set(ctx.current, { zIndex: 1, autoAlpha: 1, scale: 1 });
      window.gsap.set(ctx.next, { zIndex: 0, autoAlpha: 1, scale: 1, filter: "none" });
      return playTimeline(function (tl) {
        tl.to(ctx.current, { scale: 0.85, opacity: 0.4, duration: 0.7, ease: "power4.inOut" }, 0)
          .to(ctx.next, { scale: 1, duration: 0.7, ease: "power3.out" }, 0.1)
          .add(function () { ctx.commit(); }, 0.6);
      }, ctx.done);
    },

    // ── 淡入淡出（最轻量）──
    fade: function (ctx) {
      window.gsap.set(ctx.next, { autoAlpha: 0, scale: 1.02 });
      return playTimeline(function (tl) {
        tl.to(ctx.current, { autoAlpha: 0, duration: 0.3 }, 0)
          .to(ctx.next, { autoAlpha: 1, scale: 1, duration: 0.45 }, 0.15)
          .add(function () { ctx.commit(); }, 0.5);
      }, ctx.done);
    }
  };

  // 全局过渡执行器
  // 参数：container(幻灯片容器), current(当前slide), next(目标slide),
  //       mode(过渡模式), direction(1前进/-1后退), commit(切换后回调)
  window.__transition = function (container, current, next, mode, direction) {
    if (prefersReducedMotion() || !TRANSITIONS[mode]) {
      if (current) current.style.display = "none";
      if (next) next.style.display = "flex";
      return;
    }
    var ctx = {
      stage: container,
      current: current,
      next: next,
      direction: direction || 1,
      orientation: "horizontal",
      commit: function () {
        if (current) current.style.display = "none";
        if (next) { next.style.display = "flex"; next.style.opacity = 1; }
        if (ctx.done) ctx.done();
      },
      done: null
    };
    TRANSITIONS[mode](ctx);
  };

  // 注册为可用模式列表
  window.__TRANSITION_MODES = Object.keys(TRANSITIONS);
})();
</script>
