version: 1

scope:
  include:
    - "electron/**"
    - "plugins/**"
    - "skills/**"
    - "data/agent/rules/**"
    - "data/memory/**"
    - "data/agent/config.yml"
    - "data/agent/models.yml"
    - "start-*.bat"
    - "install.*"
    - "AGENTS.md"
  exclude:
    - "node_modules/**"
    - "home/**"
    - "python/**"
    - "node/**"
    - "bun/**"
    - "npm-global/node_modules/**"
    - "data/cache/**"
    - "data/log/**"
    - "data/agent/sessions/**"
    - "data/agent/sessions-archive/**"
    - "data/agent/blobs/**"
    - "data/agent/cache/**"
    - "data/agent/managed-skills/**"
    - "data/agent/memories/**"
    - "home/AppData/**"
    - "install/cache/**"
    - "workspace/**"
    - ".temp/**"
    - ".workbuddy/**"
    - "local_cache/**"

repowiki:
  template: "architecture"
  notes:
    - text: "Tiffa 是基于 @oh-my-pi/pi-coding-agent v17.0.7 的便携 AI 编程助手，内核版本锁定 v17.0.7，不可升级。"
    - text: "Electron 前端通过 JSONL over stdin/stdout 与内核 rpc-ui 子进程通信，不是 HTTP/WebSocket。"
    - text: "扩展 claude-mode-extension.ts 通过 Bun 运行（非 Node），使用 import.meta.dir 等 Bun API。"
    - text: "TTSR 规则是流式匹配（模型输出时实时检测），不是事后审查，零 context token 成本。"
    - text: "项目是便携设计（U盘拷走即用），所有路径通过 PORTABLE_ROOT 相对解析，禁止硬编码绝对路径。"
    - text: "记忆系统四层：USER.md → MEMORY.md → PROJECT.md → Mnemopi（语义向量），注入优先级从上到下。"
    - text: "Skills 通过内核原生 manage_skill 机制加载，每个 skill 目录含 SKILL.md 描述文件。"
  documents:
    - title: "系统总览"
      goal: "描述 Tiffa 的整体架构、七层改造理念、便携设计原则和模块间关系"
      parent: ""
    - title: "Electron 桌面前端"
      goal: "main.js 主进程架构、TiffaInstanceManager 多实例管理、IPC 通信协议、窗口生命周期"
      parent: ""
      hints:
        - "electron/main.js"
        - "electron/preload.js"
    - title: "渲染进程与 UI"
      goal: "app.js 渲染逻辑、ToolCard/Diff 视图、主题系统（7预设×3模式）、右侧栏文件树"
      parent: "Electron 桌面前端"
      hints:
        - "electron/renderer/app.js"
        - "electron/renderer/themes.js"
        - "electron/renderer/styles.css"
    - title: "Claude 化扩展"
      goal: "6 个 Hooks 的职责划分、安全拦截机制、审计日志、PROJECT.md 生成注入、error 续行"
      parent: ""
      hints:
        - "plugins/claude-mode-extension.ts"
    - title: "三重约束体系"
      goal: "TTSR 流式规则、before_agent_start 行为约束、tool_call 运行时拦截的分工与协作"
      parent: ""
      hints:
        - "data/agent/rules/"
        - "data/memory/constraints-inject.md"
    - title: "四重记忆系统"
      goal: "USER.md/MEMORY.md/PROJECT.md/Mnemopi 四层架构、gap-fill 断片补救、autoRetain 策略"
      parent: ""
      hints:
        - "data/memory/"
    - title: "Skills 技能系统"
      goal: "18 个 skill 的分类、SKILL.md 规范、加载机制、ComfyUI 生图管线"
      parent: ""
      hints:
        - "skills/"
    - title: "启动与便携架构"
      goal: "启动链路（exe→bat→Electron→Bun→内核）、环境变量注入、便携路径解析"
      parent: ""
      hints:
        - "start-desktop.bat"
        - "start-tiffa.bat"
        - "install.bat"

knowledgecard:
  notes:
    - text: "模块边界：electron/ 是桌面前端（主进程+渲染进程），plugins/ 是扩展层，skills/ 是技能层，data/ 是配置与记忆层。四者通过 PORTABLE_ROOT 相对路径关联。"
    - text: "electron/main.js 和 electron/renderer/app.js 是两个最大文件（2248行/3853行），各自内聚，不要合并分析。"
    - text: "扩展文件 plugins/claude-mode-extension.ts 运行在 Bun 环境（非 Node），使用 TypeScript + import.meta.dir。"
    - text: "skills/ 下每个子目录是独立技能单元，入口为 SKILL.md，彼此无依赖。"
    - text: "data/agent/rules/ 下的 .md 文件是 TTSR 规则（流式拦截），不是普通文档，每张知识卡应标注其拦截行为和 scope。"
