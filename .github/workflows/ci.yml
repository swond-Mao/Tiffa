name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: typecheck + unit + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
          # 前提：electron/package-lock.json 必须入库（.gitignore 不得忽略）。
          # 曾因 lock 缺失同时挂两处：npm ci 无 lock 可装 + cache-dependency-path
          # 解析失败（"Some specified paths were not resolved"）。lock 入库后
          # 缓存恢复/保存均正常（run 31452061756 全绿验证）。

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Typecheck (main process TS)
        working-directory: electron
        run: npm run typecheck:main

      - name: Typecheck (renderer TS)
        working-directory: electron
        run: npm run typecheck:renderer

      - name: Unit tests - main process
        working-directory: electron
        run: node main.test.js

      - name: Unit tests - renderer stores
        working-directory: electron
        run: npm run test:renderer

      - name: Build (main TS compile + renderer Vite)
        working-directory: electron
        run: npm run build

      - name: Verify dist artifacts
        working-directory: electron
        shell: pwsh
        run: |
          $js = (Get-ChildItem renderer/dist/assets/*.js -ErrorAction SilentlyContinue).Count
          $css = (Get-ChildItem renderer/dist/assets/*.css -ErrorAction SilentlyContinue).Count
          if (-not (Test-Path renderer/dist/index.html) -or $js -lt 1 -or $css -lt 1) {
            Write-Error "dist artifacts missing (js=$js css=$css)"; exit 1
          }
          Write-Output "dist artifacts OK (js=$js css=$css)"

# 注：E2E 冒烟（npm run test:e2e）需要真实模型 API Key，不在 CI 跑；
# 本地发布前手动执行（scripts/release.mjs 会提示）。
