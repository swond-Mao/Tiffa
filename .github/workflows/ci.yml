name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: typecheck + unit + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不用 cache: npm —— setup-node 会先跑 `npm config get cache` 拿目录
          # （C:\npm\cache），若该目录尚不存在（npm 还没跑过），actions/cache
          # 报 "Some specified paths were not resolved, unable to cache dependencies."
          # 直接全量安装：多 ~1-2 分钟，但 CI 稳定不玄学。

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Typecheck (renderer TS)
        working-directory: electron
        run: npm run typecheck

      - name: Unit tests — main process
        working-directory: electron
        run: node main.test.js

      - name: Unit tests — renderer stores
        working-directory: electron
        run: npm run test:renderer

      - name: Build renderer (production)
        working-directory: electron
        run: npm run build:renderer

      - name: Verify dist artifacts
        working-directory: electron
        shell: pwsh
        run: |
          $js = (Get-ChildItem renderer/dist/assets/*.js -ErrorAction SilentlyContinue).Count
          $css = (Get-ChildItem renderer/dist/assets/*.css -ErrorAction SilentlyContinue).Count
          if (-not (Test-Path renderer/dist/index.html) -or $js -lt 1 -or $css -lt 1) {
            Write-Error "dist artifacts missing (js=$js css=$css)"; exit 1
          }
          Write-Output "dist artifacts OK (js=$js css=$css)"

# 注：E2E 冒烟（npm run test:e2e）需要真实模型 API Key，不在 CI 跑；
# 本地发布前手动执行（scripts/release.mjs 会提示）。
